server:
  # Respect the host-provided PORT (Render), else 8080.
  port: ${PORT:8080}

spring:
  application:
    name: collab-backend
  data:
    mongodb:
      # MongoDB Atlas connection string.
      uri: ${DATABASE_URL:mongodb://localhost:27017/collaborative_coding}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Upstash requires TLS.
      ssl:
        enabled: ${REDIS_SSL:true}

# App-specific config (read via @Value / @ConfigurationProperties)
app:
  jwt:
    # HMAC signing secret; must be provided via the environment in production.
    secret: ${SECRET_KEY:change-me-dev-secret-change-me-dev-secret}
    expiration-ms: 86400000 # 24h
  cors:
    # Comma-separated list of allowed origins.
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  gemini:
    api-key: ${GOOGLE_AI_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

logging:
  level:
    org.springframework.data.mongodb: INFO
